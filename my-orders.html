<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VEXIS | طلباتي — متابعة حالة الطلب</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'gallery-white': '#ffffff',
          'studio-mist': '#f5f5f7',
          'paper-frost': '#fafafc',
          'hairline-silver': '#d6d6d6',
          'control-gray': '#e6e6e8',
          'ink': '#1d1d1f',
          'slate-apple': '#707070',
          'steel-apple': '#86868b',
          'apple-blue': '#0066cc',
          'pricing-blue': '#0071e3',
          'launch-orange': '#b64400'
        },
        borderRadius: {
          '28': '28px',
          '36': '36px',
          '980': '980px',
        }
      }
    }
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<style>
:root {
  --color-gallery-white: #ffffff;
  --color-studio-mist: #f5f5f7;
  --color-paper-frost: #fafafc;
  --color-hairline-silver: #d6d6d6;
  --color-control-gray: #e6e6e8;
  --color-ink: #1d1d1f;
  --color-slate: #707070;
  --color-steel: #86868b;
  --color-apple-blue: #0066cc;
  --color-pricing-blue: #0071e3;
  --color-launch-orange: #b64400;

  --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Cairo", sans-serif;
}

* {
  font-family: var(--font-apple);
  box-sizing: border-box;
}

body {
  background-color: var(--color-studio-mist);
  color: var(--color-ink);
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #d6d6d6; border-radius: 2px; }

/* Apple Buttons */
.apple-pricing-pill {
  background-color: var(--color-pricing-blue);
  color: #ffffff;
  border-radius: 9999px;
  font-weight: 500;
  transition: all .18s cubic-bezier(.4, 0, .2, 1);
}
.apple-pricing-pill:hover {
  background-color: #0077ed;
  transform: scale(1.01);
}

.apple-input {
  background-color: #ffffff;
  border: 1px solid var(--color-steel);
  border-radius: 980px;
  padding: 10px 18px;
  font-size: 13px;
  color: var(--color-ink);
  outline: none;
  transition: border-color .15s ease;
  width: 100%;
}
.apple-input:focus {
  border-color: var(--color-pricing-blue);
}

.apple-card {
  background-color: #ffffff;
  border-radius: 28px;
  border: 1px solid var(--color-hairline-silver);
}
</style>
</head>
<body class="bg-studio-mist text-ink min-h-screen flex flex-col" x-data="myOrders()" x-init="init()">

<!-- ============================================== -->
<!-- GLOBAL STORE NAVIGATION (44px Apple Header)    -->
<!-- ============================================== -->
<header class="bg-gallery-white/85 backdrop-blur-xl border-b border-hairline-silver sticky top-0 z-50">
  <div class="max-w-xl mx-auto px-4 h-12 flex items-center justify-between text-xs">
    
    <a href="index.html" class="flex items-center gap-2 group">
      <div class="w-6 h-6 rounded-full overflow-hidden border border-hairline-silver flex items-center justify-center">
        <img src="logo.jpeg" alt="VEXIS" class="w-full h-full object-cover">
      </div>
      <span class="font-semibold text-sm tracking-widest text-ink uppercase">VEXIS</span>
    </a>

    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-hairline-silver text-[11px] font-medium text-slate-apple cursor-default">
        <span>🇪🇬</span>
        <span class="text-ink font-semibold tracking-wider">EGYPT</span>
      </div>

      <a href="index.html" class="text-xs text-apple-blue hover:underline">
        العودة للمتجر
      </a>
    </div>

  </div>
</header>

<main class="max-w-xl mx-auto px-4 py-10 flex-1 w-full space-y-6">

  <div class="border-b border-hairline-silver pb-4">
    <h1 class="text-2xl font-semibold text-ink tracking-tight">طلباتي — My Orders</h1>
    <p class="text-xs text-slate-apple mt-1">متابعة وتتبع جميع طلباتك السابقة من VEXIS.</p>
  </div>

  <!-- Phone Search Card -->
  <div x-show="!phone" class="apple-card p-6 space-y-4">
    <div>
      <h2 class="text-sm font-semibold text-ink">البحث برقم الهاتف</h2>
      <p class="text-xs text-slate-apple">أدخل رقم الموبايل المستخدم أثناء إتمام الطلب:</p>
    </div>
    
    <div class="flex gap-2">
      <input type="tel"
             x-model="inputPhone"
             placeholder="01xxxxxxxxx"
             class="apple-input flex-1 font-mono"
             @keyup.enter="searchByPhone()">
      <button @click="searchByPhone()" class="apple-pricing-pill px-6 py-2.5 text-xs">
        بحث
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div x-show="loading" class="flex justify-center py-12">
    <div class="flex flex-col items-center gap-2 text-slate-apple">
      <i class="fas fa-spinner fa-spin text-xl text-ink"></i>
      <span class="text-xs">جاري تحميل تفاصيل طلباتك...</span>
    </div>
  </div>

  <!-- Orders List -->
  <template x-if="!loading && phone && orders.length > 0">
    <div class="space-y-4">
      
      <div class="flex items-center justify-between text-xs text-slate-apple">
        <span>تم العثور على <strong class="text-ink" x-text="orders.length"></strong> طلب</span>
        <button @click="phone = ''; orders = []" class="text-apple-blue hover:underline text-xs">
          تغيير رقم الهاتف
        </button>
      </div>

      <template x-for="ord in orders" :key="ord.order_number">
        <div class="apple-card p-6 space-y-4">
          
          <div class="flex items-center justify-between border-b border-hairline-silver pb-3">
            <div>
              <span class="text-[10px] text-steel-apple block uppercase tracking-wider">Order No.</span>
              <span class="font-mono font-semibold text-sm text-ink tracking-wider" x-text="ord.order_number"></span>
            </div>
            <span class="px-3 py-1 rounded-full text-[11px] font-medium"
                  :class="ord.status === 'delivered' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-studio-mist text-slate-apple border border-hairline-silver'"
                  x-text="getStatusLabel(ord.status)">
            </span>
          </div>

          <div class="space-y-2 text-xs">
            <div class="flex justify-between text-slate-apple">
              <span>المحافظة</span>
              <span class="font-medium text-ink" x-text="ord.governorate"></span>
            </div>
            <div class="flex justify-between text-slate-apple">
              <span>مصاريف الشحن</span>
              <span class="font-mono text-ink" x-text="(ord.shipping_cost || 0) + ' EGP'"></span>
            </div>
            <div class="flex justify-between text-slate-apple pt-2 border-t border-hairline-silver">
              <span class="font-semibold text-ink">إجمالي الفاتورة</span>
              <span class="font-mono font-semibold text-sm text-ink" x-text="(ord.total || 0) + ' EGP'"></span>
            </div>
          </div>

        </div>
      </template>

    </div>
  </template>

  <!-- No Orders Found -->
  <template x-if="!loading && phone && orders.length === 0">
    <div class="apple-card p-10 text-center space-y-3">
      <i class="fas fa-box-open text-3xl text-steel-apple"></i>
      <h3 class="font-semibold text-sm text-ink">لم يتم العثور على طلبات</h3>
      <p class="text-xs text-slate-apple">لم نجد أي طلبات مسجلة برقم الهاتف المدخل.</p>
      <button @click="phone = ''; orders = []" class="apple-pricing-pill px-5 py-2 text-xs inline-block mt-2">
        المحاولة برقم آخر
      </button>
    </div>
  </template>

</main>

<script>
function myOrders() {
  return {
    phone: '',
    inputPhone: '',
    loading: false,
    orders: [],

    init() {
      const saved = localStorage.getItem('vexis_customer_phone');
      if (saved) {
        this.phone = saved;
        this.inputPhone = saved;
        this.fetchOrders();
      }
    },

    searchByPhone() {
      const p = this.inputPhone.trim();
      if (!p) return;
      this.phone = p;
      localStorage.setItem('vexis_customer_phone', p);
      this.fetchOrders();
    },

    async fetchOrders() {
      this.loading = true;
      try {
        const res = await fetch('/api/orders?phone=' + encodeURIComponent(this.phone));
        const data = await res.json();
        if (data.success) {
          this.orders = data.orders || [];
        } else {
          this.orders = [];
        }
      } catch {
        this.orders = [];
      } finally {
        this.loading = false;
      }
    },

    getStatusLabel(s) {
      const map = {
        pending: 'قيد المراجعة',
        processing: 'جاري التجهيز',
        shipped: 'في الطريق إليك',
        delivered: 'تم التوصيل بنجاح',
        cancelled: 'ملغي'
      };
      return map[s] || 'قيد المعالجة';
    }
  }
}
</script>

</body>
</html>
