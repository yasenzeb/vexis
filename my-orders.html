<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VEXIS | طلباتي</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: { cairo: ['Cairo', 'sans-serif'] } } } }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
  body { background-color: #f8fafc; }
</style>
</head>
<body class="min-h-screen pb-20" x-data="myOrders()" x-init="init()">

  <!-- NAV -->
  <nav class="bg-white border-b border-gray-100 sticky top-0 z-40 shadow-sm">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="text-gray-500 hover:text-black transition flex items-center gap-2 text-sm font-bold">
        <i class="fas fa-arrow-right"></i> العودة
      </a>
      <a href="index.html" class="bg-black text-white font-black px-3 py-1 rounded-lg text-sm tracking-widest flex items-center gap-1.5">
        <img src="logo.jpeg" alt="Vexis" class="w-5 h-5 rounded-full">
        <span>VEXIS</span>
      </a>
    </div>
  </nav>

  <main class="max-w-md mx-auto px-4 pt-6 space-y-5">

    <div>
      <h1 class="text-2xl font-black text-gray-900">طلباتي <span class="text-cyan-500">🛍️</span></h1>
      <p class="text-xs text-gray-400 font-semibold mt-1">جميع طلباتك السابقة من هذا الجهاز</p>
    </div>

    <!-- Phone Input (if no phone saved) -->
    <div x-show="!phone" class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm space-y-3">
      <p class="text-sm font-bold text-gray-700">أدخل رقم هاتفك لعرض طلباتك:</p>
      <div class="flex gap-2">
        <input
          type="tel"
          x-model="inputPhone"
          placeholder="01xxxxxxxxx"
          class="flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-bold focus:outline-none focus:border-black"
          @keyup.enter="searchByPhone()"
        >
        <button @click="searchByPhone()" class="bg-black text-white px-4 py-2.5 rounded-xl text-sm font-black hover:bg-gray-800 transition">
          بحث
        </button>
      </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-10">
      <div class="flex flex-col items-center gap-3">
        <i class="fas fa-spinner fa-spin text-3xl text-cyan-500"></i>
        <p class="text-xs text-gray-400 font-bold">جاري تحميل طلباتك...</p>
      </div>
    </div>

    <!-- Orders List -->
    <template x-if="!loading && phone && orders.length > 0">
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <p class="text-xs text-gray-500 font-bold"><span x-text="orders.length"></span> طلبات موجودة</p>
          <button @click="phone=''; orders=[]" class="text-xs text-gray-400 hover:text-black font-bold flex items-center gap-1">
            <i class="fas fa-times text-xs"></i> تغيير الرقم
          </button>
        </div>
        <template x-for="ord in orders" :key="ord.order_number">
          <div class="bg-white border border-gray-100 rounded-2xl shadow-sm overflow-hidden">
            <!-- Order Header -->
            <div class="p-4 border-b border-gray-50">
              <div class="flex items-center justify-between">
                <div>
                  <p class="text-[10px] text-gray-400 font-bold">رقم الطلب</p>
                  <p class="font-black text-sm text-gray-900 tracking-wider" x-text="ord.order_number"></p>
                </div>
                <span class="px-3 py-1 rounded-full text-white text-xs font-black" :class="getStatusClass(ord.status)" x-text="getStatusLabel(ord.status)"></span>
              </div>
            </div>
            <!-- Order Details -->
            <div class="p-4 space-y-2">
              <div class="flex justify-between text-xs">
                <span class="text-gray-400 font-bold">المحافظة</span>
                <span class="font-extrabold text-gray-800" x-text="ord.governorate"></span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-gray-400 font-bold">رسوم الشحن</span>
                <span class="font-extrabold text-gray-800" x-text="'EGP ' + (ord.shipping_cost || 0)"></span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-gray-400 font-bold">إجمالي الطلب</span>
                <span class="font-black text-black" x-text="'EGP ' + (ord.total || 0)"></span>
              </div>
              <div class="flex justify-between text-xs">
                <span class="text-gray-400 font-bold">التاريخ</span>
                <span class="font-bold text-gray-600" x-text="formatDate(ord.created_at)"></span>
              </div>
              <!-- Rejection Reason -->
              <div x-show="ord.status === 'rejected' && ord.rejection_reason" class="bg-red-50 border border-red-100 rounded-xl px-3 py-2 mt-1">
                <p class="text-[11px] text-red-700 font-semibold">
                  <i class="fas fa-exclamation-triangle ml-1"></i>
                  سبب الرفض: <span class="font-black" x-text="ord.rejection_reason"></span>
                </p>
              </div>
            </div>
            <!-- Action Button -->
            <div class="px-4 pb-4">
              <a :href="'invoice.html?order=' + ord.order_number"
                class="block w-full bg-black text-white text-center text-xs font-black py-2.5 rounded-xl hover:bg-gray-800 transition flex items-center justify-center gap-2">
                <i class="fas fa-file-invoice"></i> عرض الفاتورة
              </a>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- No Orders -->
    <template x-if="!loading && phone && orders.length === 0">
      <div class="text-center py-16">
        <i class="fas fa-box-open text-6xl text-gray-200 mb-4 block"></i>
        <p class="font-black text-gray-500 text-lg">لا توجد طلبات</p>
        <p class="text-xs text-gray-400 mt-2">لم يتم العثور على طلبات بهذا الرقم</p>
        <button @click="phone=''; orders=[]" class="mt-4 text-xs text-cyan-600 font-bold underline">تجربة رقم آخر</button>
      </div>
    </template>

  </main>

  <script>
    function myOrders() {
      return {
        phone: '',
        inputPhone: '',
        orders: [],
        loading: false,

        init() {
          // Try to load phone from localStorage (saved at checkout)
          const savedPhone = localStorage.getItem('vexis_customer_phone');
          if (savedPhone) {
            this.phone = savedPhone;
            this.loadOrders();
          }
        },

        async searchByPhone() {
          const p = this.inputPhone.trim();
          if (!p || p.length < 7) {
            alert('الرجاء إدخال رقم هاتف صحيح');
            return;
          }
          this.phone = p;
          localStorage.setItem('vexis_customer_phone', p);
          await this.loadOrders();
        },

        async loadOrders() {
          this.loading = true;
          try {
            const res = await fetch(`/api/orders-by-phone?phone=${encodeURIComponent(this.phone)}`);
            const data = await res.json();
            if (data.success) {
              this.orders = data.orders || [];
            }
          } catch (e) {
            console.error('Error loading orders:', e);
          } finally {
            this.loading = false;
          }
        },

        getStatusLabel(st) {
          const labels = {
            pending: 'معلق ⏳',
            review: 'جاري المراجعة 🔍',
            shipped: 'خرج للشحن 🚚',
            delivered: 'تم التسليم 🎉',
            rejected: 'مرفوض ❌'
          };
          return labels[st] || st;
        },

        getStatusClass(st) {
          const classes = {
            pending: 'bg-amber-400',
            review: 'bg-blue-500',
            shipped: 'bg-purple-500',
            delivered: 'bg-emerald-500',
            rejected: 'bg-red-500'
          };
          return classes[st] || 'bg-gray-400';
        },

        formatDate(dateStr) {
          if (!dateStr) return '—';
          return new Date(dateStr).toLocaleDateString('ar-EG', {
            year: 'numeric', month: 'short', day: 'numeric'
          });
        }
      }
    }
  </script>
</body>
</html>
