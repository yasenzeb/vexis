<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VEXIS | Shopping Bag — Review Your Order</title>
<meta name="description" content="Review your VEXIS gym sportswear purchases in your shopping cart and complete your order now.">
<meta name="keywords" content="gym t-shirts, men's sportswear Egypt, training clothes, VEXIS">

<!-- Favicon & Touch Icons -->
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="shortcut icon" href="favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          'gallery-white': '#ffffff',
          'studio-mist': '#f5f5f7',
          'paper-frost': '#fafafc',
          'hairline-silver': '#d6d6d6',
          'control-gray': '#e6e6e8',
          'ink': '#1d1d1f',
          'slate-apple': '#4a4a4a',
          'steel-apple': '#5a5a5a',
          'apple-blue': '#0066cc',
          'pricing-blue': '#0071e3',
          'launch-orange': '#b64400'
        },
        borderRadius: {
          '28': '28px',
          '36': '36px',
          '980': '980px',
        }
      }
    }
  }
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

<style>
:root {
  --color-gallery-white: #ffffff;
  --color-studio-mist: #f5f5f7;
  --color-paper-frost: #fafafc;
  --color-hairline-silver: #d6d6d6;
  --color-control-gray: #e6e6e8;
  --color-ink: #1d1d1f;
  --color-slate: #707070;
  --color-steel: #86868b;
  --color-apple-blue: #0066cc;
  --color-pricing-blue: #0071e3;
  --color-launch-orange: #b64400;

  --font-apple: "Cairo", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
}

* {
  font-family: var(--font-apple);
  box-sizing: border-box;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

body {
  background-color: var(--color-studio-mist);
  color: var(--color-ink);
  -webkit-font-smoothing: antialiased;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #d6d6d6; border-radius: 2px; }

/* Apple Buttons */
.apple-pricing-pill {
  background-color: var(--color-pricing-blue);
  color: #ffffff;
  border-radius: 9999px;
  font-weight: 500;
  transition: all .18s cubic-bezier(.4, 0, .2, 1);
}
.apple-pricing-pill:hover {
  background-color: #0077ed;
  transform: scale(1.01);
}

.apple-explore-pill {
  background-color: transparent;
  color: var(--color-ink);
  border: 1px solid var(--color-steel);
  border-radius: 9999px;
  font-weight: 500;
  transition: all .18s cubic-bezier(.4, 0, .2, 1);
}
.apple-explore-pill:hover {
  border-color: var(--color-ink);
  background-color: var(--color-gallery-white);
}

.apple-input {
  background-color: #ffffff;
  border: 1px solid var(--color-steel);
  border-radius: 980px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--color-ink);
  outline: none;
  transition: border-color .15s ease;
}
.apple-input:focus {
  border-color: var(--color-pricing-blue);
}

/* 28px Card */
.apple-card {
  background-color: #ffffff;
  border-radius: 28px;
  border: 1px solid var(--color-hairline-silver);
}
</style>
</head>
<body class="bg-studio-mist text-ink min-h-screen flex flex-col" x-data="cartPage()" x-init="init()">

<!-- ============================================== -->
<!-- GLOBAL STORE NAVIGATION (44px Apple Header)    -->
<!-- ============================================== -->
<header class="bg-gallery-white/85 backdrop-blur-xl border-b border-hairline-silver sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 h-12 flex items-center justify-between text-xs">
    
    <!-- Logo -->
    <a href="index.html" class="flex items-center gap-2 group">
      <div class="w-6 h-6 rounded-full overflow-hidden border border-hairline-silver flex items-center justify-center">
        <img src="logo.jpeg" alt="VEXIS" class="w-full h-full object-cover">
      </div>
      <span class="font-semibold text-sm tracking-widest text-ink uppercase">VEXIS</span>
    </a>

    <!-- Controls -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-hairline-silver text-[11px] font-medium text-slate-apple cursor-default">
        <span>🇪🇬</span>
        <span class="text-ink font-semibold tracking-wider">EGYPT</span>
      </div>

      <a href="my-orders.html" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-apple hover:text-ink transition" title="My Orders">
        <i class="far fa-user text-sm"></i>
      </a>

      <a href="index.html" class="text-xs text-apple-blue hover:underline">
        Back to Store
      </a>
    </div>

  </div>
</header>

<div class="max-w-3xl mx-auto px-4 py-12 flex-1 w-full space-y-8">
  
  <div class="border-b border-hairline-silver pb-4">
    <h1 class="text-3xl font-semibold text-ink tracking-tight">Review your Bag.</h1>
    <p class="text-xs text-slate-apple mt-1">Free delivery and flexible exchange on all orders across Egypt.</p>
  </div>

  <template x-if="cart.length > 0">
    <div class="space-y-6">
      
      <!-- Items 28px White Card -->
      <div class="apple-card overflow-hidden">
        <template x-for="(item, idx) in cart" :key="item._key">
          <div class="p-6 flex items-start gap-5 border-b border-hairline-silver last:border-0 relative">
            
            <!-- Remove Button -->
            <button @click="removeItem(idx)"
                    class="absolute top-5 right-5 text-steel-apple hover:text-launch-orange transition text-xs"
                    title="Remove item">
              <i class="fas fa-times"></i>
            </button>

            <!-- Image Frame -->
            <div class="w-20 h-20 md:w-24 md:h-24 bg-studio-mist rounded-2xl border border-hairline-silver flex items-center justify-center p-2 flex-shrink-0">
              <img :src="item.image_url || 'logo.jpeg'" alt="" class="w-full h-full object-contain">
            </div>

            <!-- Details -->
            <div class="flex-1 space-y-2 pr-6">
              <h3 class="font-semibold text-sm md:text-base text-ink" x-text="item.name"></h3>
              
              <div class="text-xs text-slate-apple flex gap-4">
                <span x-show="item.size" x-text="'Size: ' + item.size"></span>
                <span x-show="item.color" x-text="'Color: ' + item.color"></span>
              </div>

              <div class="flex items-center justify-between pt-2">
                <div class="text-base font-semibold text-ink" x-text="(item.finalPrice * item.qty) + ' EGP'"></div>
                
                <!-- Qty Pill -->
                <div class="flex items-center border border-hairline-silver rounded-full overflow-hidden bg-studio-mist">
                  <button @click="updateQty(idx, -1)" class="w-8 h-7 flex items-center justify-center text-slate-apple hover:text-ink transition text-xs">−</button>
                  <span class="w-6 text-center text-xs font-semibold text-ink" x-text="item.qty"></span>
                  <button @click="updateQty(idx, 1)" class="w-8 h-7 flex items-center justify-center text-slate-apple hover:text-ink transition text-xs">+</button>
                </div>
              </div>
            </div>

          </div>
        </template>
      </div>

      <!-- Summary 28px White Card -->
      <div class="apple-card p-6 md:p-8 space-y-6">
        
        <!-- Promo Code Pill Box -->
        <div>
          <label class="block text-xs text-slate-apple mb-1.5 font-medium">Do you have a promo code?</label>
          <div class="flex gap-2">
            <input type="text"
                   x-model="promoInput"
                   placeholder="Enter code"
                   class="apple-input flex-1 text-xs uppercase font-mono"
                   :disabled="appliedPromo">
            <button @click="applyPromo()"
                    class="apple-ink-pill px-5 py-2 text-xs"
                    x-show="!appliedPromo">
              Apply
            </button>
            <button @click="removePromo()"
                    class="text-launch-orange text-xs px-3 hover:underline"
                    x-show="appliedPromo">
              Remove
            </button>
          </div>
          <p x-show="promoMsg" :class="promoSuccess ? 'text-emerald-600' : 'text-launch-orange'" class="text-[11px] mt-1.5 font-medium" x-text="promoMsg"></p>
        </div>

        <div class="space-y-3 text-xs border-t border-hairline-silver pt-4">
          <div class="flex justify-between items-center text-slate-apple">
            <span>Subtotal</span>
            <span class="text-ink font-semibold" x-text="subtotal + ' EGP'"></span>
          </div>

          <div x-show="discountAmount > 0" class="flex justify-between items-center text-emerald-600 font-medium">
            <span>Discount (<span x-text="appliedPromo?.code"></span>)</span>
            <span x-text="'- ' + discountAmount + ' EGP'"></span>
          </div>

          <div class="flex justify-between items-center text-slate-apple">
            <span>Shipping</span>
            <span class="text-emerald-600 font-medium">Calculated at checkout</span>
          </div>

          <div class="border-t border-hairline-silver pt-4 flex justify-between items-center">
            <span class="text-base font-semibold text-ink">Total</span>
            <span class="text-2xl font-semibold text-ink" x-text="finalTotal + ' EGP'"></span>
          </div>
        </div>

        <!-- Checkout Button: Apple Pricing Blue Pill -->
        <a href="checkout.html"
           class="apple-pricing-pill w-full py-4 text-sm flex items-center justify-center gap-2 text-center">
          <span>Check Out</span> <i class="fas fa-chevron-right text-xs"></i>
        </a>

      </div>

    </div>
  </template>

  <!-- Empty Bag -->
  <template x-if="cart.length === 0">
    <div class="apple-card p-12 text-center space-y-4">
      <i class="fas fa-shopping-bag text-4xl text-steel-apple"></i>
      <h2 class="text-xl font-semibold text-ink">Your Bag is empty.</h2>
      <p class="text-xs text-slate-apple max-w-sm mx-auto">Items added to your bag will appear here.</p>
      <div class="pt-2">
        <a href="index.html" class="apple-pricing-pill px-6 py-2.5 text-xs inline-block">
          Continue Shopping
        </a>
      </div>
    </div>
  </template>

</div>

<script>
function cartPage() {
  return {
    cart: [],
    subtotal: 0,
    promoInput: '',
    appliedPromo: null,
    promoMsg: '',
    promoSuccess: false,
    discountAmount: 0,

    get finalTotal() {
      return Math.max(0, this.subtotal - this.discountAmount);
    },

    init() {
      this.loadCart();
      const savedPromo = localStorage.getItem('vexis_promo');
      if (savedPromo) {
        try {
          this.appliedPromo = JSON.parse(savedPromo);
          this.calcDiscount();
        } catch {}
      }
    },

    loadCart() {
      try { this.cart = JSON.parse(localStorage.getItem('vexis_cart')||'[]'); } catch { this.cart=[]; }
      this.calc();
    },

    calc() {
      this.subtotal = this.cart.reduce((acc, item) => acc + (item.finalPrice * item.qty), 0);
      this.calcDiscount();
    },

    calcDiscount() {
      if (!this.appliedPromo) {
        this.discountAmount = 0;
        return;
      }
      if (this.appliedPromo.discount_type === 'percent') {
        this.discountAmount = Math.round(this.subtotal * (this.appliedPromo.discount_value / 100));
      } else {
        this.discountAmount = Math.min(this.subtotal, Number(this.appliedPromo.discount_value || 0));
      }
    },

    updateQty(idx, change) {
      if (this.cart[idx]) {
        this.cart[idx].qty += change;
        if (this.cart[idx].qty <= 0) {
          this.cart.splice(idx, 1);
        }
        localStorage.setItem('vexis_cart', JSON.stringify(this.cart));
        this.calc();
      }
    },

    removeItem(idx) {
      this.cart.splice(idx, 1);
      localStorage.setItem('vexis_cart', JSON.stringify(this.cart));
      this.calc();
    },

    async applyPromo() {
      const code = this.promoInput.trim().toUpperCase();
      if (!code) return;
      try {
        const res = await fetch('/api/checkout?action=validate_promo&code=' + encodeURIComponent(code));
        const data = await res.json();
        if (data.success && data.promo) {
          this.appliedPromo = data.promo;
          localStorage.setItem('vexis_promo', JSON.stringify(data.promo));
          this.promoSuccess = true;
          this.promoMsg = 'Promo code applied!';
          this.calcDiscount();
        } else {
          this.promoSuccess = false;
          this.promoMsg = data.error || 'Invalid promo code';
        }
      } catch {
        this.promoSuccess = false;
        this.promoMsg = 'Failed to validate code';
      }
    }
  }
}
</script>

</body>
</html>
